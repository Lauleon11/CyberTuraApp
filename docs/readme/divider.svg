<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Separador">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5EE7FF" stop-opacity="0"/>
      <stop offset=".25" stop-color="#5EE7FF"/>
      <stop offset=".5" stop-color="#6A5CFF"/>
      <stop offset=".75" stop-color="#E14BFF"/>
      <stop offset="1" stop-color="#E14BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .d{transform-box:fill-box;transform-origin:center;animation:p 2.6s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @media (prefers-reduced-motion:reduce){.d{animation:none}}
  </style>
  <rect x="0" y="11" width="900" height="2" rx="1" fill="url(#g)"/>
  <circle class="d" cx="350" cy="12" r="4" fill="#5EE7FF"/>
  <circle class="d" cx="450" cy="12" r="6" fill="#6A5CFF" style="animation-delay:.4s"/>
  <circle class="d" cx="550" cy="12" r="4" fill="#E14BFF" style="animation-delay:.8s"/>
</svg>
